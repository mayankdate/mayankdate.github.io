projects:
  # ----- WORK -----
  - title: "Digital Competency Mock App"
    year: 2026
    tags: [work, research]
    blurb: >
      A mock health-record web app used to assess the digital competency of frontline health workers (ASHAs, ANMs, etc.)
      in the Indian public health system. It mimics the look and basic functionality of a real reporting app (e.g. UWIN).
      During a competency survey, a health worker fills in a record for a mock patient case, and the app 
      captures interaction metrics (time per field, edits, errors) for later analysis.
    links:
      Github Repo: "https://github.com/mayankdate/CompetencyApp"
      WebApp: "https://mayankdate.github.io/CompetencyApp/"
    
  - title: "Biostatistics for Public Health App"
    year: 2025
    tags: [work, research]
    blurb: >
      WORK IN PROGRESS. My professor at Hopkins, Dr. Diwakar Mohan built the sample size calculator.
      The distribution explorer is inspired by Matt Bognar's probability applets. I've tried to bring those two together in
      a single streamlined app that can be used by public health students and professionals to explore statistical concepts
      and perform calculations.
    links:
      WebApp: "https://mayankdate.github.io/BioStatsApp/"
      Github Repo: "https://github.com/mayankdate/BioStatsApp"

