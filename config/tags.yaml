# ============================================================
# TAG SYSTEM for projects
# ============================================================
#
# tag_order: ordering of tag groups on the Projects page (first = top).
# Add a new tag just by appending it here and tagging a project with it.
# Any project tag that is NOT in `tag_order` gets appended to the end
# automatically — the build never breaks.
#
# tag_labels: human-readable chip text.
# tag_description: shown under the group header on the Projects page.
# ============================================================

tag_order:
  - work
  - research
  - personal
  - vibecoded

tag_labels:
  work: "Work"
  research: "Research"
  personal: "Personal"
  vibecoded: "Vibecoded"

tag_descriptions:
  work: "Work-related projects."
  research: "Projects tied to academic research."
  personal: "Personal projects and experiments."
  vibecoded: "Making Claude bring my ideas to life."
