name: "Mayank Date"
title: "Public health researcher · Global digital health analytics"
headline: "Public health researcher · Global digital health analytics"

# One-paragraph bio, shown in the About section on the home page.
# Multi-line YAML — the `|` keeps line breaks, `>` folds them. Use `>` for prose.
blurb: >
  Public health researcher trained at Johns Hopkins Bloomberg School of
  Public Health, specializing in epidemiologic methods, measurement of
  population health indicators, and digital health systems. I lead
  analytics for multi-country projects at the Center for Global Digital
  Health Innovations with partners including UNICEF, the World Bank, and
  the ITU. My work spans machine-learning quality-assurance pipelines,
  statistical analyses on large cohort studies and RCTs, and
  population-level health surveys. I'm preparing for doctoral training
  to advance measurement science and build scalable tools that
  strengthen how global health programs are run.

