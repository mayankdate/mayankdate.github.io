# ============================================================
# PUBLICATIONS
# ============================================================
#
# How this file is read:
#   1. The build fetches your public works from ORCID (orcid_id in
#      profile.yaml) at build time.
#   2. For each ORCID entry whose DOI matches a key in `orcid_overrides`
#      below, the override's fields are merged onto the entry
#      (award, note).
#   3. All `manual` entries are appended.
#   4. The combined list is deduped: journal articles supersede preprints
#      with ≥85% title similarity.  Override with `hide: true` or
#      `keep_as_preprint: true` on a per-DOI basis in `orcid_overrides`.
#   5. The result is grouped on the Research page by `type` and sorted
#      year-descending inside each group.
#
# Groups shown on the page (in order):
#   - journal-article
#   - preprint
#   - conference-paper / poster / conference-presentation
#   - book-chapter / other / copyright-registration
# ============================================================

# Overlay fields onto ORCID entries, keyed by lowercase DOI.
orcid_overrides:
  # Example — uncomment and edit:
  #
  # "10.2196/59968":
  #   note: "Co-author · digital well-being rapid review"
  #
  # "10.2196/preprints.109155":
  #   hide: true                 # force-hide this preprint if a published
  #                              # version appears on ORCID
  #   # keep_as_preprint: true   # or force-show even if a match exists

# ============================================================
# MANUAL ENTRIES  — anything not on ORCID: posters, oral
# presentations, copyright registrations, invited talks, etc.
# ============================================================

