  <script>
    // Scroll-aware header: adds a hairline border once scrolled past the top.
    (function () {
      var hdr = document.querySelector('.site-header');
      if (!hdr) return;
      function onScroll() {
        if (window.scrollY > 8) hdr.classList.add('is-scrolled');
        else hdr.classList.remove('is-scrolled');
      }
      onScroll();
      window.addEventListener('scroll', onScroll, { passive: true });
    })();
  </script>
<style>
  /* Give the game the stage. The usual main padding is dropped so
     the iframe starts right under the header. */
  main { padding-top: 0 !important; }

  .elsewhere-stage {
    max-width: none;
    margin: 0;
    padding: 0;
  }

  .elsewhere-frame-wrap {
    position: relative;
    border: 0;
    border-radius: 0;
    overflow: hidden;
    background: #0D2545;
    box-shadow: 0 2px 0 rgba(13, 37, 69, 0.08);
  }

  .elsewhere-frame-wrap iframe {
    display: block;
    width: 100%;
    /* Viewport minus the site header (~64px) and the caption bar */
    height: calc(100vh - 110px);
    min-height: 480px;
    border: 0;
  }

  .elsewhere-caption {
    font-family: JetBrains Mono, monospace;
    font-size: 12px;
    color: var(--muted, #3a4a63);
    margin: 0;
    padding: 14px 24px;
    text-align: center;
    border-top: 1px solid var(--border, rgba(13, 37, 69, 0.12));
  }

  .elsewhere-caption kbd {
    display: inline-block;
    padding: 1px 6px;
    margin: 0 1px;
    border: 1px solid var(--border, rgba(13, 37, 69, 0.2));
    border-radius: 3px;
    background: var(--surface, rgba(13, 37, 69, 0.04));
    font-family: inherit;
    font-size: 11px;
    color: var(--text, #0D2545);
  }

  .elsewhere-caption .caption-dot {
    margin: 0 10px;
    opacity: 0.5;
  }

  /* Site footer out of the way — the game page doesn't need one */
  .site-footer { display: none; }
</style>
