# ---------------------------------------------------------------
# AfterHours · map.yaml
# ---------------------------------------------------------------
# Every map layer is a full-canvas 2048×2048 "slice" — the island, the
# house floor, and one per object (walls, stations, …). Workflow:
#
#   1. `python3 scripts/build_templates.py` exports the unpainted slices
#      into assets/map/templates/ (+ _painter_reference.png to trace).
#   2. Paint each slice in Procreate at 2048×2048 and export it (same
#      filename) into assets/map/painted/.
#   3. That's it — a painted slice overrides its template automatically:
#      the game loads painted/<name>.png when it exists, else
#      templates/<name>.png. No edits here needed to switch one over.
#
# The paths below point at the templates (the always-present base); the
# engine upgrades each to the painted/ version on its own. Anything not
# listed stays code-drawn.
#
# NOTE: windows are live sky cutouts, with a frame PNG at
# assets/map/templates/window_<id>_frame.png (also paint-overridable).
# ---------------------------------------------------------------

# Ground slices, drawn back-to-front: the island (grass + cliff) then the
# house floor (+ stairs). They're separate so they take different colours.
ground:
  - assets/map/templates/island.png
  - assets/map/templates/floor.png

objects:
  # back + divider walls
  wall_library:      assets/map/templates/wall_library.png
  wall_cafe:         assets/map/templates/wall_cafe.png
  wall_music:        assets/map/templates/wall_music.png
  wall_gallery:      assets/map/templates/wall_gallery.png
  wall_sushi:        assets/map/templates/wall_sushi.png
  wall_south_east:   assets/map/templates/wall_south_east.png
  wall_south_west_a: assets/map/templates/wall_south_west_a.png
  wall_south_west_b: assets/map/templates/wall_south_west_b.png

  # side walls / returns
  side_library_w:    assets/map/templates/side_library_w.png
  side_library_e:    assets/map/templates/side_library_e.png
  side_cafe_w:       assets/map/templates/side_cafe_w.png
  side_music_w:      assets/map/templates/side_music_w.png
  side_music_e:      assets/map/templates/side_music_e.png
  side_east:         assets/map/templates/side_east.png
  side_east_stub:    assets/map/templates/side_east_stub.png

  # stations (table + whatever sits on it; paint the device in the headroom)
  bookshelf:         assets/map/templates/bookshelf.png
  gaming:            assets/map/templates/gaming.png
  fireplace:         assets/map/templates/fireplace.png
  coffee:            assets/map/templates/coffee.png
  sushi:             assets/map/templates/sushi.png
  turntable:         assets/map/templates/turntable.png

  # wall-mounted (non-window)
  gallery:           assets/map/templates/gallery.png
