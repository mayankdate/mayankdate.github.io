# ---------------------------------------------------------------
# AfterHours · interactions.yaml
# ---------------------------------------------------------------
# Each key is a scene-object id. `label` is the E-prompt. `effects`
# is an ordered list run top-to-bottom when you press E / Space.
#
# Effect types (add more by adding a handler in Interactions.js):
#   { modal: <key> }            open a content modal (books/music/…)
#   { dialog: [lines] }         speak; E/Space advances
#   { sound: <name>, duration } play a one-shot sound, then wait
#   { spawn: {ref,id,at,...} }  place a sprite prop in the world
#   { despawn: <id> }           remove it
#   { wait: <ms> }              pause the sequence
#   { toggle_fire: true }       fireplace on/off + crackle ambience
#   { cycle_weather: [list] }   step weather/ambience presets
#   { serve_sushi: true }       random sushi + eat + line
# ---------------------------------------------------------------

bookshelf:  { label: Books,  effects: [ { modal: books } ] }
gaming:     { label: Games,  effects: [ { modal: games } ] }
turntable:  { label: Music,  effects: [ { modal: music } ] }
gallery:    { label: Art,    effects: [ { modal: art   } ] }

coffee:
  label: Coffee
  effects:
    - { sound: whirr, duration: 1600 }
    - { spawn: { ref: cup, id: _cup, at: [29.7, 20.6], sortY: 22.4, anim: steam } }
    - { wait: 350 }
    - { dialog: [ "Teleporting coffee to physical space...", "...your firewall blocked the espresso. Try harder." ] }
    - { despawn: _cup }

sushi:
  label: Sushi
  effects:
    - { serve_sushi: true }

fireplace:
  label: Fireplace
  effects:
    - { toggle_fire: true }

# Either window cycles the weather outside — the sky in every window,
# plus its ambience, steps cloudy → rain → storm → clear.
window_cafe:
  label: Window
  effects:
    - { cycle_weather: [ cloudy, rain, storm, clear ] }

window_library:
  label: Window
  effects:
    - { cycle_weather: [ cloudy, rain, storm, clear ] }
