title: Reading nook
intro: |
  A rotating stack of what I'm reading, re-reading, or carrying
  around hoping to open on the train.

shelf:
  - title: The Overstory
    author: Richard Powers
    note: |
      Nine lives, one forest. The sort of novel that re-tunes
      your relationship with the trees you walk past.

  - title: Why We Sleep
    author: Matthew Walker
    note: |
      Public-health reading disguised as a page-turner. Still
      the book I lend most often.

  - title: Piranesi
    author: Susanna Clarke
    note: |
      Short, strange, luminous. Read it in one sitting if you can.
