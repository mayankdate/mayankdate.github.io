# ---------------------------------------------------------------
# Elsewhere · interactables.yaml
# ---------------------------------------------------------------
# Clickable furniture. Each sits on a tile (which becomes
# non-walkable so you walk up to it), shows a bobbing indicator
# + hover label, and opens the modal named by `content`.
# ---------------------------------------------------------------

- id: bookshelf
  sprite: bookshelf
  tile: { x: 17, y: 5 }
  label: Books
  content: books

- id: record_player
  sprite: record_player
  tile: { x: 27, y: 5 }
  label: Music
  content: music

- id: game_shelf
  sprite: game_shelf
  tile: { x: 27, y: 13 }
  label: Games
  content: games

# A little gallery wall — three frames, all open the collection.
- id: frame_1
  sprite: frame_1
  tile: { x: 15, y: 13 }
  label: Art
  content: art

- id: frame_2
  sprite: frame_2
  tile: { x: 17, y: 13 }
  label: Art
  content: art

- id: frame_3
  sprite: frame_3
  tile: { x: 19, y: 13 }
  label: Art
  content: art
