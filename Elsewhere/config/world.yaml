# ---------------------------------------------------------------
# Elsewhere  world.yaml  (generated; edit the grids freely)
# Two character grids. `floor` is the ground you stand on,
# `objects` is what sits on top (walls, windows, trees).
# `legend` maps each char to a tile/sprite + walkability.
# A door is simply a blank in `objects` over a walkable floor.
# ---------------------------------------------------------------

grid:
  width: 44
  height: 32
  tile: 32
spawn:
  x: 22
  y: 14
legend:
  floor:
    '~':
      tile: water
      walk: false
    .:
      tile: grass
      walk: true
    f:
      tile: grass_flowers
      walk: true
    ',':
      tile: sand
      walk: true
    p:
      tile: path
      walk: true
    d:
      tile: dock
      walk: true
    R:
      tile: floor_wood_dark
      walk: true
    M:
      tile: floor_rug
      walk: true
    G:
      tile: floor_wood_light
      walk: true
    A:
      tile: floor_stone
      walk: true
    H:
      tile: floor_hub
      walk: true
  objects:
    '#':
      sprite: wall_stone
      walk: false
      tall: true
    '=':
      sprite: wall_wood
      walk: false
      tall: true
    O:
      sprite: wall_window
      walk: false
      tall: true
    T:
      sprite: tree
      walk: false
      tall: true
