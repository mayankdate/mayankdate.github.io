# ---------------------------------------------------------------
# Elsewhere · world.yaml
# ---------------------------------------------------------------
# Everything spatial. Edit this to redecorate the island.
# Tile size is 32x32. Grid is 24 wide x 16 tall.
# Walls stack on top of the floor; they are 32x48 sprites whose
# bottom-right 32x32 occupies the tile.
# ---------------------------------------------------------------

grid:
  width: 24
  height: 16
  tile: 32

# Where the firefly starts.
spawn: { x: 12, y: 14 }

# Rooms are rectangular floor zones. Each one gets a flat tile
# type painted edge-to-edge.
rooms:
  - name: reading_nook
    bounds: { x: 1,  y: 1, w: 7, h: 6 }
    floor: floor_wood_dark

  - name: listening_lounge
    bounds: { x: 9,  y: 1, w: 7, h: 6 }
    floor: floor_rug

  - name: game_corner
    bounds: { x: 17, y: 1, w: 6, h: 6 }
    floor: floor_wood_light

  - name: gallery
    bounds: { x: 1,  y: 8, w: 7, h: 7 }
    floor: floor_stone

  - name: hub
    bounds: { x: 9,  y: 8, w: 7, h: 7 }
    floor: floor_wood_light

  - name: garden
    bounds: { x: 17, y: 8, w: 6, h: 7 }
    floor: floor_grass

# Walls follow the room perimeters. Each entry is one sprite
# dropped at a tile. type ∈ { h, v, corner_tl, doorway }.
# h = horizontal, v = vertical.
# This list is dumb and explicit so you can swap tiles freely.
walls:
  # Outer perimeter top
  - { x: 0,  y: 0, type: corner_tl }
  - { x: 1,  y: 0, type: h }
  - { x: 2,  y: 0, type: h }
  - { x: 3,  y: 0, type: h }
  - { x: 4,  y: 0, type: h }
  - { x: 5,  y: 0, type: h }
  - { x: 6,  y: 0, type: h }
  - { x: 7,  y: 0, type: h }
  - { x: 8,  y: 0, type: h }
  - { x: 9,  y: 0, type: h }
  - { x: 10, y: 0, type: h }
  - { x: 11, y: 0, type: h }
  - { x: 12, y: 0, type: h }
  - { x: 13, y: 0, type: h }
  - { x: 14, y: 0, type: h }
  - { x: 15, y: 0, type: h }
  - { x: 16, y: 0, type: h }
  - { x: 17, y: 0, type: h }
  - { x: 18, y: 0, type: h }
  - { x: 19, y: 0, type: h }
  - { x: 20, y: 0, type: h }
  - { x: 21, y: 0, type: h }
  - { x: 22, y: 0, type: h }
  - { x: 23, y: 0, type: h }
  # Outer perimeter sides
