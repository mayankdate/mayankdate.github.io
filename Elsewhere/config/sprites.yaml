# ---------------------------------------------------------------
# Elsewhere · sprites.yaml
# ---------------------------------------------------------------
# Every animated thing points at a sprite sheet (a grid of frames)
# + named animations. The renderer blits the current frame; if a
# sheet is missing it falls back to the code-drawn shape.
#
# frameW/frameH = cell size in the sheet (px).
# draw.w/draw.h = how big it's drawn in the world (tile units).
# An anim is one row: { row, from, to, fps, loop }.
# Paint over the placeholder sheets in assets/sprites/ — keep the
# grid and the frame order and everything keeps working.
# ---------------------------------------------------------------

player:
  sheet: assets/sprites/player.png
  frameW: 48
  frameH: 64
  draw: { w: 1.7, h: 2.6 }
  anims:
    idle_down:  { row: 0, from: 0, to: 0, fps: 1 }
    walk_down:  { row: 0, from: 1, to: 3, fps: 8 }
    idle_left:  { row: 1, from: 0, to: 0, fps: 1 }
    walk_left:  { row: 1, from: 1, to: 3, fps: 8 }
    idle_right: { row: 2, from: 0, to: 0, fps: 1 }
    walk_right: { row: 2, from: 1, to: 3, fps: 8 }
    idle_up:    { row: 3, from: 0, to: 0, fps: 1 }
    walk_up:    { row: 3, from: 1, to: 3, fps: 8 }

# Shared layout for all cats; each cat names its own sheet in cats.yaml.
cat:
  frameW: 40
  frameH: 32
  draw: { w: 1.5, h: 1.2 }
  anims:
    idle:  { row: 0, from: 0, to: 3, fps: 3 }
    walk:  { row: 1, from: 0, to: 3, fps: 9 }
    sit:   { row: 2, from: 0, to: 3, fps: 2 }
    sleep: { row: 3, from: 0, to: 3, fps: 1.2 }

cup:
  sheet: assets/sprites/cup.png
  frameW: 24
  frameH: 28
  draw: { w: 0.8, h: 0.95 }
  anims:
    steam: { row: 0, from: 0, to: 3, fps: 6 }

sushi:
  sheet: assets/sprites/sushi.png
  frameW: 28
  frameH: 28
  draw: { w: 0.95, h: 0.95 }
  variants: 6      # six single-frame sushi in row 0

# --- animated accents: looping sprites that sit on top of a station ---
# (placed in accents.yaml). Paint over the placeholder sheets; keep the
# grid and frame order.
flame:
  sheet: assets/sprites/flame.png
  frameW: 48
  frameH: 48
  draw: { w: 1.9, h: 1.9 }
  anims:
    loop: { row: 0, from: 0, to: 3, fps: 10 }

platter:
  sheet: assets/sprites/platter.png
  frameW: 32
  frameH: 32
  draw: { w: 1.4, h: 1.4 }
  anims:
    spin: { row: 0, from: 0, to: 3, fps: 8 }
