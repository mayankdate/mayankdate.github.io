# ---------------------------------------------------------------
# Elsewhere · intro.yaml
# ---------------------------------------------------------------
# The splash greeting (shown before the game loads) and the
# dialog the clone hears the moment it drops in.
# ---------------------------------------------------------------

splash:
  greeting:
    - "Oh hey! Thanks for reading my profile."
    - "If you want to get to know me beyond the resume, come hang out a bit, explore my interests, meet my cats."
    - "Let me spin you up a digital clone real quick."
  button: "Print Clone"

# Spoken right after the clone lands. E / Space advances.
dialog:
  - speaker: "Mayank"
    text: "Hm. The replicator ran out of ink, so we couldn't colour yours in. But hey, it's perfectly functional!"
  - text: "WASD or the arrow keys to move. Tap E to interact with items and say hi to the cats."
