<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Elsewhere · Mayank Date</title>
  <meta name="description" content="A quiet pixel island. WASD to wander." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Game canvas mounts here -->
  <div id="game-root"></div>

  <!-- Zoom HUD (shown once you're controllable) -->
  <div id="zoom-hud" aria-label="Zoom controls">
    <button type="button" data-zoom="in"  aria-label="Zoom in">+</button>
    <button type="button" data-zoom="out" aria-label="Zoom out">−</button>
  </div>

  <!-- Intro / bioprinter dialog -->
  <div id="dialog-root" aria-live="polite"></div>

  <!-- Content modal (books / music / games / art / cats) -->
  <div id="modal-root" aria-live="polite"></div>

  <!-- Opening splash: greeting + Load clone -->
  <div id="splash">
    <div class="splash-card">
      <img class="splash-portrait" src="assets/sprites/mayank_portrait.png" alt="Pixel portrait of Mayank" />
      <div id="splash-greeting" class="splash-greeting"></div>
      <div class="clone-bar"><div id="clone-bar-fill"></div></div>
      <button id="load-clone" type="button">Load clone</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.70.0/phaser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>

  <script type="module" src="src/main.js"></script>
</body>
</html>
